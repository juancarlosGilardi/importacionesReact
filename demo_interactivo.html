const Btn = ({ children, variant='primary', className='', ...props }) => {
  const v = {
    primary:'bg-blue-600 hover:bg-blue-700 text-white shadow-sm',
    secondary:'bg-white hover:bg-gray-50 text-gray-700 border border-gray-300',
    success:'bg-emerald-600 hover:bg-emerald-700 text-white',

  return <button className={`px-4 py-2 rounded-lg text-sm font-medium transition-colors ${v[variant]||v.primary} ${className}`} {...props}>{children}</button>;
};

/* Modal + Form helpers */
const Modal = ({ open, onClose, title, children, wide }) => {
  if(!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center bg-black/40 pt-[5vh] overflow-y-auto" onClick={onClose}>
      <div className={`bg-white rounded-2xl shadow-2xl ${wide?'w-full max-w-3xl':'w-full max-w-lg'} my-4 mx-4`} onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between px-6 py-4 border-b sticky top-0 bg-white rounded-t-2xl z-10">
          <h2 className="text-lg font-bold text-gray-800">{title}</h2>
          <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
        </div>
        <div className="px-6 py-5">{children}</div>
      </div>
    </div>
  );
};
const FormField = ({ label, children }) => (

const selectCls = "w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:border-blue-500";
const SuccessToast = ({ message, onClose }) => {
  useEffect(()=>{ const t=setTimeout(onClose,3000); return ()=>clearTimeout(t); },[]);
  return (
    <div className="fixed top-6 right-6 z-[60] bg-emerald-600 text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-2 animate-[fadeIn_0.3s_ease]">
      <span className="text-lg">✅</span><span className="font-medium text-sm">{message}</span>

  );
};

const OrdenesPage = () => {
  const [data, setData] = useState([...ORDENES]);
  const [selected, setSelected] = useState(null);
  const [estados, setEstados] = useState({});
  const [showForm, setShowForm] = useState(false);
  const [toast, setToast] = useState('');
  const getEstado = (o) => estados[o.id] || o.estado;
  const nextEstado = { borrador:'confirmada', confirmada:'en_transito', en_transito:'en_aduana', en_aduana:'liquidada' };

  const advance = (o) => {
    const cur = getEstado(o);
    if(nextEstado[cur]) setEstados({...estados, [o.id]: nextEstado[cur]});
  };

  /* Form state */
  const emptyItem = { producto:'', cantidad:'', precio:'' };
  const [ocForm, setOcForm] = useState({ proveedor:PROVEEDORES[0].razon, fecha:new Date().toISOString().slice(0,10), moneda:'USD', incoterm:'FOB' });
  const [ocItems, setOcItems] = useState([{...emptyItem}]);
  const updOc = (k,v) => setOcForm({...ocForm,[k]:v});
  const updItem = (idx,k,v) => { const ni=[...ocItems]; ni[idx]={...ni[idx],[k]:v}; setOcItems(ni); };
  const addItem = () => setOcItems([...ocItems,{...emptyItem}]);
  const rmItem = (idx) => ocItems.length>1 && setOcItems(ocItems.filter((_,i)=>i!==idx));

  const handleSaveOc = () => {
    const validItems = ocItems.filter(it=>it.producto && Number(it.cantidad)>0 && Number(it.precio)>0);
    if(!validItems.length) return;
    const num = `OC-2026-${String(data.length+70).padStart(4,'0')}`;
    const items = validItems.map(it=>({ producto:it.producto, cantidad:Number(it.cantidad), precio:Number(it.precio), subtotal:Number(it.cantidad)*Number(it.precio) }));
    const newOc = { id:Date.now(), numero:num, proveedor:ocForm.proveedor, fecha:ocForm.fecha, moneda:ocForm.moneda, incoterm:ocForm.incoterm, estado:'borrador', items };
    setData([...data, newOc]);
    setShowForm(false); setOcForm({ proveedor:PROVEEDORES[0].razon, fecha:new Date().toISOString().slice(0,10), moneda:'USD', incoterm:'FOB' }); setOcItems([{...emptyItem}]);
    setToast(`Orden ${num} creada con ${items.length} items`);
  };

  const ocTotal = ocItems.reduce((s,it)=>{
    const q=Number(it.cantidad)||0, p=Number(it.precio)||0;
    return s+(q*p);
  },0);

  return (
    <div className="fade-in">
      {toast && <SuccessToast message={toast} onClose={()=>setToast('')} />}
      <PageHeader title="Ordenes de Compra" subtitle={`${data.length} ordenes registradas`}>
        <Btn onClick={()=>setShowForm(true)}>+ Nueva Orden</Btn>
      </PageHeader>
      {!selected ? (
        <Card className="overflow-hidden">
          <table className="w-full text-sm">
            <thead><tr className="bg-gray-50 text-left">
              <th className="px-5 py-3 font-semibold text-gray-600">Numero</th>
              <th className="px-5 py-3 font-semibold text-gray-600">Proveedor</th>
              <th className="px-5 py-3 font-semibold text-gray-600">Fecha</th>
              <th className="px-5 py-3 font-semibold text-gray-600">Moneda</th>
              <th className="px-5 py-3 font-semibold text-gray-600">Incoterm</th>
              <th className="px-5 py-3 font-semibold text-gray-600 text-right">Total FOB</th>
              <th className="px-5 py-3 font-semibold text-gray-600">Estado</th>
            </tr></thead>
            <tbody>
              {data.map(o=>{
                const total = o.items.reduce((s,i)=>s+i.subtotal,0);
                const est = getEstado(o);
                return (
                  <tr key={o.id} className="border-t border-gray-100 cursor-pointer hover:bg-blue-50/50" onClick={()=>setSelected(o)}>
                    <td className="px-5 py-3 font-mono font-medium text-blue-600">{o.numero}</td>
                    <td className="px-5 py-3">{o.proveedor}</td>
                    <td className="px-5 py-3">{o.fecha}</td>
                    <td className="px-5 py-3">{o.moneda}</td>
                    <td className="px-5 py-3"><Badge text={o.incoterm} color="blue" /></td>
                    <td className="px-5 py-3 text-right font-semibold">${fmt(total)}</td>
                    <td className="px-5 py-3"><Badge text={estadoLabel(est)} color={estadoColor(est)} /></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </Card>
      ) : (
        <div>
          <button onClick={()=>setSelected(null)} className="text-blue-600 hover:text-blue-800 text-sm font-medium mb-4 flex items-center gap-1">← Volver a lista</button>
          <Card className="p-6 mb-4">
            <div className="flex items-center justify-between mb-4">
              <h2 className="text-xl font-bold text-gray-800">{selected.numero}</h2>
              <Badge text={estadoLabel(getEstado(selected))} color={estadoColor(getEstado(selected))} />
            </div>
            <div className="grid grid-cols-4 gap-4 text-sm">
              <div><span className="text-gray-500">Proveedor:</span><p className="font-medium">{selected.proveedor}</p></div>
              <div><span className="text-gray-500">Fecha:</span><p className="font-medium">{selected.fecha}</p></div>
              <div><span className="text-gray-500">Moneda:</span><p className="font-medium">{selected.moneda}</p></div>
              <div><span className="text-gray-500">Incoterm:</span><p className="font-medium">{selected.incoterm}</p></div>
            </div>
          </Card>
          <Card className="overflow-hidden mb-4">
            <table className="w-full text-sm">
              <thead><tr className="bg-gray-50 text-left">
                <th className="px-5 py-3 font-semibold text-gray-600">Producto</th>
                <th className="px-5 py-3 font-semibold text-gray-600 text-right">Cantidad</th>
                <th className="px-5 py-3 font-semibold text-gray-600 text-right">Precio Unit.</th>
                <th className="px-5 py-3 font-semibold text-gray-600 text-right">Subtotal</th>
              </tr></thead>
              <tbody>
                {selected.items.map((it,i)=>(
                  <tr key={i} className="border-t border-gray-100">
                    <td className="px-5 py-3 font-medium">{it.producto}</td>
                    <td className="px-5 py-3 text-right">{it.cantidad}</td>
                    <td className="px-5 py-3 text-right">${fmt(it.precio)}</td>
                    <td className="px-5 py-3 text-right font-semibold">${fmt(it.subtotal)}</td>
                  </tr>
                ))}
              </tbody>
              <tfoot>
                <tr className="border-t-2 border-gray-200 bg-blue-50">
                  <td colSpan="3" className="px-5 py-3 font-bold text-right text-gray-700">Total FOB ({selected.moneda})</td>
                  <td className="px-5 py-3 text-right font-bold text-blue-700 text-lg">${fmt(selected.items.reduce((s,i)=>s+i.subtotal,0))}</td>
                </tr>
              </tfoot>
            </table>
          </Card>
          {nextEstado[getEstado(selected)] && (
            <Btn variant="success" onClick={()=>advance(selected)}>
              Avanzar a: {estadoLabel(nextEstado[getEstado(selected)])} →
            </Btn>
          )}
        </div>
      )}
      <Modal open={showForm} onClose={()=>setShowForm(false)} title="Nueva Orden de Compra" wide>
        <div className="space-y-4">
          <div className="grid grid-cols-4 gap-3">
            <FormField label="Proveedor *">
              <select className={selectCls} value={ocForm.proveedor} onChange={e=>updOc('proveedor',e.target.value)}>
                {PROVEEDORES.filter(p=>p.estado==='activo').map(p=><option key={p.id} value={p.razon}>{p.razon}</option>)}
              </select>
            </FormField>
            <FormField label="Fecha">
              <input type="date" className={inputCls} value={ocForm.fecha} onChange={e=>updOc('fecha',e.target.value)} />
            </FormField>
            <FormField label="Moneda">
              <select className={selectCls} value={ocForm.moneda} onChange={e=>updOc('moneda',e.target.value)}>

              <select className={selectCls} value={ocForm.incoterm} onChange={e=>updOc('incoterm',e.target.value)}>
                {['FOB','CIF','EXW','DDP','CFR','FCA'].map(i=><option key={i}>{i}</option>)}

            <div className="flex items-center justify-between mb-2">

                  {ocItems.map((it,idx)=>{

                      <tr key={idx} className="border-t border-gray-100">

const GastosPage = () => {
  const [data, setData] = useState([...GASTOS]);
  const [filtro, setFiltro] = useState('');
  const [showForm, setShowForm] = useState(false);
  const [toast, setToast] = useState('');
  const tipoColors = { flete_internacional:'bg-blue-500', seguro:'bg-cyan-500', agente_aduana:'bg-purple-500', almacenaje:'bg-amber-500', transporte_local:'bg-emerald-500', handling:'bg-indigo-500', otros:'bg-gray-500' };
  const tipoLabels = { flete_internacional:'Flete Internacional', seguro:'Seguro', agente_aduana:'Agente Aduana', almacenaje:'Almacenaje', transporte_local:'Transporte Local', handling:'Handling', otros:'Otros' };
  const tipos = Object.keys(tipoLabels);
  const filtered = filtro ? data.filter(g=>g.tipo===filtro) : data;
  const total = filtered.reduce((s,g)=>s+g.monto,0);

  const emptyGasto = { tipo:'flete_internacional', desc:'', monto:'', moneda:'USD', comprobante:'' };
  const [gForm, setGForm] = useState({...emptyGasto});
  const updG = (k,v) => setGForm({...gForm,[k]:v});

  const handleSaveGasto = () => {
    const monto = Number(gForm.monto);
    if(!gForm.desc.trim() || monto<=0) return;
    const comp = gForm.comprobante || `FT-${String(Math.floor(Math.random()*900)+100)}-${String(Math.floor(Math.random()*9000)+1000)}`;
    setData([...data, { id:Date.now(), tipo:gForm.tipo, desc:gForm.desc, monto, moneda:gForm.moneda, comprobante:comp, estado:'pendiente' }]);
    setShowForm(false); setGForm({...emptyGasto});
    setToast(`Gasto "${gForm.desc.substring(0,40)}" registrado por ${gForm.moneda==='PEN'?'S/':'$'}${fmt(monto)}`);
  };

  return (
    <div className="fade-in">
      {toast && <SuccessToast message={toast} onClose={()=>setToast('')} />}
      <PageHeader title="Gastos" subtitle={`${data.length} gastos registrados`}>
        <Btn onClick={()=>setShowForm(true)}>+ Nuevo Gasto</Btn>
      </PageHeader>
      <Card className="overflow-hidden">
        <div className="p-4 border-b border-gray-100">
          <select value={filtro} onChange={e=>setFiltro(e.target.value)} className="px-4 py-2 border border-gray-300 rounded-lg text-sm">
            <option value="">Todos los tipos</option>
            {tipos.map(t=><option key={t} value={t}>{tipoLabels[t]||t}</option>)}
          </select>
        </div>
        <table className="w-full text-sm">
          <thead><tr className="bg-gray-50 text-left">
            <th className="px-5 py-3 font-semibold text-gray-600">Tipo</th>
            <th className="px-5 py-3 font-semibold text-gray-600">Descripcion</th>
            <th className="px-5 py-3 font-semibold text-gray-600 text-right">Monto</th>
            <th className="px-5 py-3 font-semibold text-gray-600">Moneda</th>
            <th className="px-5 py-3 font-semibold text-gray-600">Comprobante</th>
            <th className="px-5 py-3 font-semibold text-gray-600">Estado</th>
          </tr></thead>
          <tbody>
            {filtered.map(g=>(
              <tr key={g.id} className="border-t border-gray-100 hover:bg-blue-50/50">
                <td className="px-5 py-3"><div className="flex items-center gap-2"><span className={`w-2.5 h-2.5 rounded-full ${tipoColors[g.tipo]||'bg-gray-400'}`}></span><span className="text-sm">{tipoLabels[g.tipo]||g.tipo}</span></div></td>
                <td className="px-5 py-3 text-gray-700">{g.desc}</td>
                <td className="px-5 py-3 text-right font-semibold">{g.moneda==='PEN'?'S/':'$'}{fmt(g.monto)}</td>
                <td className="px-5 py-3">{g.moneda}</td>
                <td className="px-5 py-3 font-mono text-xs text-gray-500">{g.comprobante}</td>
                <td className="px-5 py-3"><Badge text={estadoLabel(g.estado)} color={estadoColor(g.estado)} /></td>
              </tr>
            ))}
          </tbody>
          <tfoot>
            <tr className="border-t-2 border-gray-300 bg-gray-50">
              <td colSpan="2" className="px-5 py-3 font-bold text-right">Total ({filtered.length} gastos):</td>
              <td className="px-5 py-3 text-right font-bold text-lg text-blue-700">{fmt(total)}</td>
              <td colSpan="3" className="px-5 py-3 text-gray-500 text-xs">(monedas mixtas)</td>
            </tr>
          </tfoot>
        </table>
      </Card>
      <Modal open={showForm} onClose={()=>setShowForm(false)} title="Nuevo Gasto de Importacion">
        <div className="space-y-4">
          <FormField label="Tipo de Gasto *">
            <select className={selectCls} value={gForm.tipo} onChange={e=>updG('tipo',e.target.value)}>
              {tipos.map(t=><option key={t} value={t}>{tipoLabels[t]}</option>)}
            </select>
          </FormField>
          <FormField label="Descripcion *">
            <input className={inputCls} placeholder="Ej: Flete maritimo Shanghai-Callao" value={gForm.desc} onChange={e=>updG('desc',e.target.value)} />
          </FormField>
          <div className="grid grid-cols-3 gap-3">
            <FormField label="Monto *">
              <input type="number" className={inputCls} placeholder="0.00" step="0.01" value={gForm.monto} onChange={e=>updG('monto',e.target.value)} />
            </FormField>
            <FormField label="Moneda">
              <select className={selectCls} value={gForm.moneda} onChange={e=>updG('moneda',e.target.value)}>
                <option>USD</option><option>PEN</option><option>EUR</option>
              </select>
            </FormField>
            <FormField label="N° Comprobante (opcional)">
              <input className={inputCls} placeholder="FT-001-0234" value={gForm.comprobante} onChange={e=>updG('comprobante',e.target.value)} />
            </FormField>
          </div>
          <div className="flex justify-end gap-2 pt-3 border-t">
            <Btn variant="secondary" onClick={()=>setShowForm(false)}>Cancelar</Btn>
            <Btn onClick={handleSaveGasto} className={(!gForm.desc.trim()||(Number(gForm.monto)||0)<=0)?'opacity-50':''}>Registrar Gasto</Btn>
          </div>
        </div>
      </Modal>
    </div>
  );
};

/* ============================================================

   ============================================================ */
const DuaPage = () => {
  const [fob, setFob] = useState(17750);
  const [flete, setFlete] = useState(1850);
  const [seguro, setSeguro] = useState(266.25);
  const [adValoremPct, setAdValoremPct] = useState(6);

  const cif = fob + flete + seguro;
  const adValorem = cif * (adValoremPct / 100);
  const baseIgv = cif + adValorem;
  const igv = baseIgv * 0.16;
  const ipm = baseIgv * 0.02;
  const basePercepcion = cif + adValorem + igv + ipm;
  const percepcion = basePercepcion * 0.035;
  const totalTributos = adValorem + igv + ipm + percepcion;

  const ResultCard = ({ label, value, color, big }) => (
    <div className={`${color} rounded-xl p-4 ${big?'col-span-2':''}`}>
      <p className="text-xs font-medium opacity-80 uppercase tracking-wide">{label}</p>

  return (
    <div className="fade-in">
      <PageHeader title="DUA - Calculo de Tributos" subtitle="Calculo en tiempo real de tributos aduaneros peruanos" />

                className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm font-mono" />
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-600 mb-1">Seguro (USD)</label>
              <input type="number" value={seguro} onChange={e=>setSeguro(Number(e.target.value)||0)}
                className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm font-mono" />
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-600 mb-1">Tasa Ad Valorem (%)</label>
              <input type="number" value={adValoremPct} onChange={e=>setAdValoremPct(Number(e.target.value)||0)}
                className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm font-mono" step="0.5" />

              <p>Ad Val. = CIF x {adValoremPct}%</p>
              <p>Base IGV = CIF + Ad Val.</p>
              <p>IGV = Base IGV x 16%</p>
              <p>IPM = Base IGV x 2%</p>
              <p>Base Perc. = CIF+AdVal+IGV+IPM</p>
              <p>Percepcion = Base Perc. x 3.5%</p>

            <h3 className="font-semibold text-gray-800 mb-4">Resultado de Liquidacion</h3>

            <div className="flex items-center justify-between">
              <div>

const ProrrateoPage = () => {
  const [step, setStep] = useState(1);
  const [impId, setImpId] = useState('');
  const [metodo, setMetodo] = useState('valor_fob');
  const [results, setResults] = useState(null);
  const [applied, setApplied] = useState(false);

  const calcular = () => {
    const imp = IMPORTACIONES.find(i=>i.numero===impId);
    if(!imp) return;
    const flete = imp.flete, seguro = imp.seguro, tributos = imp.tributos, gastos = imp.gastos;
    const items = [
      { producto:'Taladro Percutor 800W', fob:12500, peso:640, vol:1.28, qty:200 },
      { producto:'Amoladora Angular 4.5"', fob:5250, peso:315, vol:0.63, qty:150 },
    ];
    if(impId==='IMP-2026-0018'){
      items.length=0;
      items.push({ producto:'Sierra Circular 7 1/4"', fob:8800, peso:480, vol:0.96, qty:100 });
    } else if(impId==='IMP-2026-0023'){
      items.length=0;
      items.push({ producto:'Cerradura Digital Biometrica', fob:15600, peso:450, vol:0.45, qty:300 });
    }
    const totalFob = items.reduce((s,i)=>s+i.fob,0);
    const totalPeso = items.reduce((s,i)=>s+i.peso,0);
    const totalVol = items.reduce((s,i)=>s+i.vol,0);
    const totalQty = items.reduce((s,i)=>s+i.qty,0);
    const dist = items.map(it=>{
      let pct;
      if(metodo==='valor_fob') pct=it.fob/totalFob;
      else if(metodo==='peso') pct=it.peso/totalPeso;
      else if(metodo==='volumen') pct=it.vol/totalVol;
      else pct=it.qty/totalQty;
      const flP=flete*pct, seP=seguro*pct, trP=tributos*pct, gaP=gastos*pct;
      const landed=it.fob+flP+seP+trP+gaP;
      return { ...it, pct:pct*100, fleteP:flP, seguroP:seP, tributosP:trP, gastosP:gaP, landed, costoUnit:landed/it.qty };
    });
    setResults({ imp, dist, totals:{ flete, seguro, tributos, gastos, landed:dist.reduce((s,d)=>s+d.landed,0) } });
    setStep(3);
  };

  const metodoLabels = { valor_fob:'Valor FOB', peso:'Peso (kg)', volumen:'Volumen (m3)', cantidad:'Cantidad (unidades)' };

  return (
    <div className="fade-in">
      <PageHeader title="Prorrateo de Costos" subtitle="Distribucion de costos a nivel de producto" />

      <div className="flex items-center gap-4 mb-6">
        {[1,2,3].map(s=>(
          <div key={s} className="flex items-center gap-2">
            <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold ${step>=s?'bg-blue-600 text-white':'bg-gray-200 text-gray-500'}`}>{s}</div>
            <span className={`text-sm font-medium ${step>=s?'text-gray-800':'text-gray-400'}`}>
              {s===1?'Seleccionar Importacion':s===2?'Metodo de Prorrateo':'Resultados'}
            </span>
            {s<3 && <span className="text-gray-300 mx-2">→</span>}
          </div>
        ))}
      </div>

      {step===1 && (
        <Card className="p-6">
          <h3 className="font-semibold mb-4">Paso 1: Seleccione la importacion</h3>
          <select value={impId} onChange={e=>setImpId(e.target.value)} className="w-full max-w-md px-4 py-2.5 border border-gray-300 rounded-lg text-sm">
            <option value="">-- Seleccionar --</option>
            {IMPORTACIONES.filter(i=>i.estado!=='borrador').map(i=>(
              <option key={i.id} value={i.numero}>{i.numero} - FOB ${fmt(i.fob)} ({estadoLabel(i.estado)})</option>
            ))}
          </select>
          <div className="mt-4">
            <Btn onClick={()=>impId&&setStep(2)} className={!impId?'opacity-50 cursor-not-allowed':''}>Siguiente →</Btn>
          </div>
        </Card>
      )}

      {step===2 && (
        <Card className="p-6">
          <h3 className="font-semibold mb-4">Paso 2: Seleccione el metodo de distribucion</h3>
          <div className="grid grid-cols-2 gap-3 max-w-lg mb-6">
            {Object.entries(metodoLabels).map(([k,v])=>(
              <button key={k} onClick={()=>setMetodo(k)}
                className={`p-4 rounded-xl border-2 text-left transition-all ${metodo===k?'border-blue-500 bg-blue-50':'border-gray-200 hover:border-gray-300'}`}>
                <p className="font-medium text-sm">{v}</p>
              </button>
            ))}
          </div>
          <div className="flex gap-2">
            <Btn variant="secondary" onClick={()=>setStep(1)}>← Atras</Btn>
            <Btn onClick={calcular}>Calcular Prorrateo</Btn>
          </div>
        </Card>
      )}

      {step===3 && results && (
        <div>
          <div className="grid grid-cols-5 gap-3 mb-4">
            <Card className="p-4 bg-blue-50 border-blue-200"><p className="text-xs text-blue-600 font-medium">Flete</p><p className="text-lg font-bold text-blue-800">${fmt(results.totals.flete)}</p></Card>
            <Card className="p-4 bg-cyan-50 border-cyan-200"><p className="text-xs text-cyan-600 font-medium">Seguro</p><p className="text-lg font-bold text-cyan-800">${fmt(results.totals.seguro)}</p></Card>
            <Card className="p-4 bg-amber-50 border-amber-200"><p className="text-xs text-amber-600 font-medium">Tributos</p><p className="text-lg font-bold text-amber-800">${fmt(results.totals.tributos)}</p></Card>
            <Card className="p-4 bg-purple-50 border-purple-200"><p className="text-xs text-purple-600 font-medium">Gastos</p><p className="text-lg font-bold text-purple-800">${fmt(results.totals.gastos)}</p></Card>

          </div>
          <Card className="overflow-hidden mb-4">
            <div className="px-5 py-3 bg-gray-50 border-b text-sm font-medium text-gray-600">
              Metodo: <Badge text={metodoLabels[metodo]} color="blue" /> | Importacion: <span className="font-mono">{impId}</span>
            </div>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead><tr className="bg-gray-50 text-left text-xs">
                  <th className="px-4 py-3 font-semibold text-gray-600">Producto</th>
                  <th className="px-4 py-3 font-semibold text-gray-600 text-right">FOB</th>

                  <th className="px-4 py-3 font-semibold text-gray-600 text-right">Gastos</th>
                  <th className="px-4 py-3 font-semibold text-gray-600 text-right">Landed</th>
                  <th className="px-4 py-3 font-semibold text-gray-600 text-right">Qty</th>
                  <th className="px-4 py-3 font-semibold text-gray-600 text-right">Costo/Und</th>
                </tr></thead>
                <tbody>
                  {results.dist.map((d,i)=>(
                    <tr key={i} className="border-t border-gray-100">
                      <td className="px-4 py-3 font-medium">{d.producto}</td>
                      <td className="px-4 py-3 text-right font-mono">${fmt(d.fob)}</td>
                      <td className="px-4 py-3 text-right"><Badge text={d.pct.toFixed(1)+'%'} color="blue" /></td>
                      <td className="px-4 py-3 text-right font-mono">${fmt(d.fleteP)}</td>

          <button key={k} onClick={()=>setTab(k)}
            className={`px-4 py-2 rounded-md text-sm font-medium transition-colors ${tab===k?'bg-white text-blue-600 shadow-sm':'text-gray-600 hover:text-gray-800'}`}>{l}</button>
        ))}
      </div>

      {tab==='mensual' && (
        <Card className="overflow-hidden">
          <table className="w-full text-sm">
            <thead><tr className="bg-gray-50 text-left">
              <th className="px-5 py-3 font-semibold text-gray-600">Periodo</th>
              <th className="px-5 py-3 font-semibold text-gray-600 text-right">FOB</th>
              <th className="px-5 py-3 font-semibold text-gray-600 text-right">CIF</th>
              <th className="px-5 py-3 font-semibold text-gray-600 text-right">Tributos</th>
              <th className="px-5 py-3 font-semibold text-gray-600 text-right">Gastos</th>
              <th className="px-5 py-3 font-semibold text-gray-600 text-right">Total Landed</th>
            </tr></thead>
            <tbody>
              {mensualData.map((r,i)=>(
                <tr key={i} className="border-t border-gray-100">
                  <td className="px-5 py-3 font-medium">{r.mes}</td>
                  <td className="px-5 py-3 text-right font-mono">${fmt(r.fob)}</td>
                  <td className="px-5 py-3 text-right font-mono">${fmt(r.cif)}</td>
                  <td className="px-5 py-3 text-right font-mono text-amber-600">${fmt(r.tributos)}</td>
                  <td className="px-5 py-3 text-right font-mono">${fmt(r.gastos)}</td>
                  <td className="px-5 py-3 text-right font-bold text-emerald-700">${fmt(r.landed)}</td>
                </tr>
              ))}
            </tbody>
            <tfoot>
              <tr className="border-t-2 border-gray-300 bg-gray-50 font-bold">
                <td className="px-5 py-3">TOTAL Q1 2026</td>
                <td className="px-5 py-3 text-right">${fmt(mensualData.reduce((s,r)=>s+r.fob,0))}</td>
                <td className="px-5 py-3 text-right">${fmt(mensualData.reduce((s,r)=>s+r.cif,0))}</td>
                <td className="px-5 py-3 text-right text-amber-600">${fmt(mensualData.reduce((s,r)=>s+r.tributos,0))}</td>
                <td className="px-5 py-3 text-right">${fmt(mensualData.reduce((s,r)=>s+r.gastos,0))}</td>
                <td className="px-5 py-3 text-right text-emerald-700">${fmt(mensualData.reduce((s,r)=>s+r.landed,0))}</td>
              </tr>
            </tfoot>
          </table>
        </Card>
      )}

      {tab==='proveedor' && (
        <Card className="overflow-hidden">
          <table className="w-full text-sm">
            <thead><tr className="bg-gray-50 text-left">
              <th className="px-5 py-3 font-semibold text-gray-600">Proveedor</th>
              <th className="px-5 py-3 font-semibold text-gray-600 text-center">OCs</th>
              <th className="px-5 py-3 font-semibold text-gray-600 text-right">FOB Total</th>
              <th className="px-5 py-3 font-semibold text-gray-600 text-right">Tributos</th>
              <th className="px-5 py-3 font-semibold text-gray-600 text-right">Landed Total</th>
              <th className="px-5 py-3 font-semibold text-gray-600 text-right">% del Total</th>
            </tr></thead>
            <tbody>
              {provData.map((r,i)=>(
                <tr key={i} className="border-t border-gray-100">
                  <td className="px-5 py-3 font-medium">{r.proveedor}</td>
                  <td className="px-5 py-3 text-center">{r.ocs}</td>
                  <td className="px-5 py-3 text-right font-mono">${fmt(r.fob)}</td>
                  <td className="px-5 py-3 text-right font-mono text-amber-600">${fmt(r.tributos)}</td>
                  <td className="px-5 py-3 text-right font-bold">${fmt(r.landed)}</td>
                  <td className="px-5 py-3 text-right">
                    <div className="flex items-center justify-end gap-2">
                      <div className="w-16 bg-gray-200 rounded-full h-2"><div className="bg-blue-500 h-2 rounded-full" style={{width:`${r.pct}%`}}></div></div>
                      <span className="font-mono text-xs">{r.pct}%</span>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </Card>
      )}

      {tab==='producto' && (
        <Card className="overflow-hidden">
          <table className="w-full text-sm">
            <thead><tr className="bg-gray-50 text-left">
              <th className="px-5 py-3 font-semibold text-gray-600">Producto</th>
              <th className="px-5 py-3 font-semibold text-gray-600 text-center">Imports.</th>
              <th className="px-5 py-3 font-semibold text-gray-600 text-right">Qty Total</th>
              <th className="px-5 py-3 font-semibold text-gray-600 text-right">Costo Prom.</th>
              <th className="px-5 py-3 font-semibold text-gray-600 text-right">Landed Total</th>
              <th className="px-5 py-3 font-semibold text-gray-600 text-right">Margen Est.</th>
            </tr></thead>
            <tbody>
              {prodData.map((r,i)=>(
                <tr key={i} className="border-t border-gray-100">
                  <td className="px-5 py-3 font-medium">{r.producto}</td>
                  <td className="px-5 py-3 text-center">{r.importaciones}</td>
                  <td className="px-5 py-3 text-right">{r.qtyTotal.toLocaleString()}</td>
                  <td className="px-5 py-3 text-right font-mono">${fmt(r.costoPromedio)}</td>
                  <td className="px-5 py-3 text-right font-bold">${fmt(r.landed)}</td>
                  <td className="px-5 py-3 text-right"><Badge text={r.margen} color="green" /></td>
                </tr>
              ))}
            </tbody>
          </table>
        </Card>
      )}
    </div>
  );
};

/* ============================================================
   MAIN APP
   ============================================================ */
const App = () => {
  const [loggedIn, setLoggedIn] = useState(false);
  const [page, setPage] = useState('dashboard');

  if(!loggedIn) return <LoginPage onLogin={()=>setLoggedIn(true)} />;

  const pages = {
    dashboard: DashboardPage,
    proveedores: ProveedoresPage,
    productos: ProductosPage,
    ordenes: OrdenesPage,
    importaciones: ImportacionesPage,
    gastos: GastosPage,
    dua: DuaPage,
    prorrateo: ProrrateoPage,
    almacenes: AlmacenesPage,
    kardex: KardexPage,
    reportes: ReportesPage,
  };
  const PageComponent = pages[page] || DashboardPage;

  return (
    <div className="flex min-h-screen bg-gray-50">
      <Sidebar current={page} onChange={setPage} onLogout={()=>{setLoggedIn(false);setPage('dashboard');}} />
      <main className="flex-1 ml-64">
        <div className="p-8">
          <PageComponent />
        </div>
        <footer className="text-center py-4 text-xs text-gray-400 border-t border-gray-200 mt-8">
          ImportCost Pro v1.0 - Demo Interactivo | Sistema de Costeo de Importaciones para el Peru
        </footer>
      </main>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
